# Frozen-checkpoint Diagnostic B. Fixed response cap leaves room for the prompt.
round_id: round1
enabled: true
seed: 42
n_rollout: 32
model:
  id: Qwen/Qwen2.5-Math-7B
  revision: b101308fe89651ea5ce025f25317fea6fc07e96e
  tokenizer_revision: null  # Same immutable commit as the model.
  local_path: null
  dtype: bfloat16
  max_model_len: 4096
train:
  id: ShuoZheLi/MATH-train-MATH500-test
  revision: 09ad2162c6f3a07ea71e48d7af02922b093df041  # Same pinned snapshot for both splits.
  local_path: null
  config: default
  split: train
  adapter: math
  expected_rows: 7500
  selection: sample  # Uniform sample without replacement, using the master seed.
  n_problem: 500
heldout:
  id: ShuoZheLi/MATH-train-MATH500-test
  revision: 09ad2162c6f3a07ea71e48d7af02922b093df041
  config: default
  split: test
  adapter: math
  expected_rows: 500
  selection: all  # Complete MATH500 test split, in source row order.
  n_problem: 500
prompt:
  wrapper_file: boxed_prompt.json  # Applied to train and held-out user messages.
  max_tokens: 1024  # Includes the wrapper and chat template; overlong prompts are rejected.
sampling:
  max_new_tokens: 3072  # Prompt and response caps sum to the native 4096-token context.
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  min_p: 0.0
generation:
  tensor_parallel_size: 1  # One 7B model per 96-GB GPU; avoids TP collectives over PCIe.
  parallel_splits: true
  replicas_per_split: 4  # Eight independent engines: four train, four held-out.
  dispatch_mode: continuous  # Refill slots as answers finish, with per-answer checkpointing.
  max_in_flight: 256  # Bounded outstanding requests per engine, across multiple prompts.
  max_num_seqs: 256
  max_num_batched_tokens: 16384
  enable_chunked_prefill: true
  request_chunk_size: 32  # Used only by the optional legacy batch dispatch mode.
  gpu_memory_utilization: 0.8
  enable_prefix_caching: true
verifier:
  backend: math_verify
  answer_format: boxed  # Verify the final boxed answer; no unboxed fallback.
  callable: null
  timeout_seconds: 30
routing:
  radius_coefficient: 0.4
  epsilon: 0.000001  # Same stabilizer as veRL core_algos.py; std uses divisor G.
  solver:
    max_iterations: 500  # Maximum per solve attempt; converged solves stop earlier.
features:
  backend: delta_proxy  # Author-requested DelTA Appendix F: (1 - p_y) * hidden.
  factor_cache_retention: group  # Release temporary factors after each group; retain Grams and held-out vector.
  token_chunk_size: 128
  vocab_chunk_size: 128  # Used only by the optional exact_tiled_head backend.
  logit_vocab_chunk_size: 8192  # Full-vocabulary normalizers for sampled-token probabilities.
  max_segments_per_response_budget: 128  # Preflight estimate only; never truncates segments.
memory:
  gpu_budget_gib: null  # Detect free GPU memory when null.
  cpu_budget_gib: null  # Detect available system RAM when null.
  disk_budget_gib: null  # Detect free artifact-volume space when null.
  safety_fraction: 0.8
statistics:
  bootstrap_replicates: 2000
  bootstrap_seed: null  # Derived from the required master seed.
  active_tolerance: 0.00001
